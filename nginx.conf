# ==============================================================================
# Zenve Production Nginx Configuration
# - Domain root (/) -> Doctor Login Page (doctor_frontend)
# - Subpath (/crm) -> Admin CRM Login Page (admin-frontend)
# - Invalid/unknown paths -> Handled by SPA router to never display arbitrary content
# ==============================================================================

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Enable Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. ADMIN CRM FRONTEND (/crm)
    # Visiting yourdomain.com/crm or yourdomain.com/crm/ directly opens Admin Login
    # --------------------------------------------------------------------------
    location /crm {
        alias /var/www/zenve/admin-frontend/dist;
        try_files $uri $uri/ /crm/index.html;
        index index.html;

        # Cache static assets for speed
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # --------------------------------------------------------------------------
    # 2. DOCTOR FRONTEND (Root domain: /)
    # Visiting yourdomain.com opens Doctor Login (or Dashboard if already authenticated)
    # Any unknown route is redirected back to /login via React Router
    # --------------------------------------------------------------------------
    location / {
        root /var/www/zenve/doctor_frontend/dist;
        try_files $uri $uri/ /index.html;
        index index.html;

        # Cache static assets for speed
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # --------------------------------------------------------------------------
    # 3. BACKEND API PROXIES
    # --------------------------------------------------------------------------
    # Doctor Backend (Spring Boot: port 8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Backend (Spring Boot: port 8081)
    location /admin-api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 4. SECURITY HEADERS & BLOCK SENSITIVE FILES
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

