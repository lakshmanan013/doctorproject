# --- SMS / WhatsApp via Twilio ---
# Leave these unset in dev: sends are then logged with status
# NOT_CONFIGURED instead of silently pretending to succeed.
# Get real values from https://console.twilio.com
#
# twilio.account-sid can be EITHER:
#   - a classic Account SID (starts with "AC") + twilio.auth-token = your
#     primary Auth Token from the Console dashboard, OR
#   - an API Key SID (starts with "SK") + twilio.auth-token = that key's
#     Secret — in which case twilio.parent-account-sid MUST also be set to
#     your real Account SID (starts with "AC", shown on the Console
#     dashboard), since an API key alone doesn't identify the account.
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.parent-account-sid=${TWILIO_PARENT_ACCOUNT_SID:}
twilio.sms-from=${TWILIO_SMS_FROM:}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}

# --- Razorpay (Billing → "Razorpay" payment method) ---
# Leave unset in dev: order creation will fail fast with a clear error
# instead of silently hitting Razorpay with a bad key. Get real test/live
# keys from https://dashboard.razorpay.com/app/keys
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder_key_id}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_key_secret}

