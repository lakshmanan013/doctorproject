server:
  port: ${PORT:5000}
  servlet:
    context-path: /api

spring:
  application:
    name: zenve-admin-backend
  datasource:
    url: jdbc:mysql://localhost:3306/vetcare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: Vasanth@zenve
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-for-zenve-admin-please-override-in-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
  seed:
    admin-name: ${SEED_ADMIN_NAME:Zenve Admin}
    admin-email: ${SEED_ADMIN_EMAIL:admin@zenve.in}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin-123}
  doctor-app:
    base-url: ${DOCTOR_APP_BASE_URL:http://localhost:8080/api}
    internal-secret: ${DOCTOR_APP_INTERNAL_SECRET:change-this-shared-secret}
  database:
    driver: mysql
    host: localhost:3306
    name: vetcare
    file-path: ""

---
# ---------------------------------------------------------------------------
# Profile: h2 — activated when DB_DRIVER=h2
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:${DB_FILE_PATH:./data/vetcare};AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

app:
  database:
    driver: h2
    host: ${DB_FILE_PATH:./data/vetcare}
    name: vetcare
    file-path: ${DB_FILE_PATH:./data/vetcare}
